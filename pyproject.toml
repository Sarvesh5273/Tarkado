[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tarkado"
version = "0.1.0"
description = "Local, evidence-based coding-model policy replay"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
company = ["Django==5.2.17", "django-otp==1.7.3", "waitress==3.0.2"]

[project.scripts]
tarkado = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
"engine.company" = ["templates/company/*.html", "style.css"]
